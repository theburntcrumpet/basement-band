# Builds the app when a GitHub release is published and attaches the installers to it.
# The app version is taken from the release tag (v1.2.3 -> 1.2.3).
# Run it by hand with an empty tag for a test build: the installers are attached to the workflow run
# (Artifacts) instead of a release.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach installers to (e.g. v0.2.0). Leave empty for a test build of the selected branch.
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag || github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            targets: --linux AppImage deb
            files: dist/*.AppImage dist/*.deb
          - name: Windows
            os: windows-latest
            targets: --win nsis portable
            files: dist/*.exe
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The ~100 MB open sample library is downloaded by `npm ci` (postinstall); cache it between runs.
      - name: Cache sample library
        uses: actions/cache@v4
        with:
          path: assets/samples
          key: samples-${{ hashFiles('src/engine/sample-manifest.js', 'scripts/fetch-samples.mjs') }}

      - name: Install dependencies (and fetch samples)
        run: npm ci

      - name: Make sure the sample library is complete
        run: npm run fetch-samples

      - name: Set version from tag
        if: env.TAG != ''
        shell: bash
        run: npm version --no-git-tag-version --allow-same-version "${TAG#v}"

      - name: Unit tests
        run: npm test

      # VST3 hosting: the native helper and the bundled Dexed synth go into the installers.
      - uses: ./.github/actions/plugin-host

      - name: Build installers
        run: npx electron-builder ${{ matrix.targets }} --publish never

      - name: Attach to release
        if: env.TAG != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" ${{ matrix.files }} --clobber --repo "$GITHUB_REPOSITORY"

      - name: Keep test-build installers on the workflow run
        if: env.TAG == ''
        uses: actions/upload-artifact@v4
        with:
          name: basement-band-${{ matrix.name }}
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.exe
          retention-days: 14
