# Unit tests on every push and pull request (fast: no sample download needed), and the native
# plugin helper built and checked against the bundled Dexed on every platform.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies (skip the sample download)
        run: npm ci --ignore-scripts
      - name: Unit tests
        run: npm test

  plugin-host:
    name: Plugin helper (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ./.github/actions/plugin-host
