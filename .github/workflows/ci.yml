# Unit tests on every push and pull request (fast: no sample download needed).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies (skip the sample download)
        run: npm ci --ignore-scripts
      - name: Unit tests
        run: npm test
