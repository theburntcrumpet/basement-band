# Builds the native plugin helper (native/plugin-host), bundles Dexed, and checks the two work
# together: the helper finds and scans Dexed, loads it, plays a note and reads its settings.
name: Build plugin helper
description: Build bb-plugin-host, fetch the bundled plugins and run an end-to-end check
runs:
  using: composite
  steps:
    - name: Install build dependencies (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends ninja-build xvfb \
          libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev \
          libxcursor-dev libxext-dev libxi-dev libxinerama-dev libxrandr-dev libxrender-dev libgl1-mesa-dev

    - name: Build bb-plugin-host
      shell: bash
      run: |
        args=(-S native/plugin-host -B native/plugin-host/build -DCMAKE_BUILD_TYPE=Release)
        if [ "$RUNNER_OS" = Linux ]; then args+=(-G Ninja); fi
        cmake "${args[@]}"
        cmake --build native/plugin-host/build --config Release --parallel

    # The helper needs at least the glibc it was built with, so a newer build machine quietly drops
    # older Linux systems. 2.39 is Ubuntu 24.04, and Debian 13 has 2.41; raise this only on purpose.
    - name: Check the helper still runs on the Linux systems we support
      if: runner.os == 'Linux'
      shell: bash
      run: |
        newest=$(objdump -T native/plugin-host/build/bb-plugin-host_artefacts/Release/bb-plugin-host | grep -oE 'GLIBC_[0-9.]+' | sort -Vu | tail -1)
        echo "The helper needs $newest"
        if [ "$(printf '%s\nGLIBC_2.39\n' "$newest" | sort -V | tail -1)" != GLIBC_2.39 ]; then
          echo "::error::The helper needs $newest, newer than the 2.39 we support"
          exit 1
        fi

    - name: Bundle plugins (Dexed)
      shell: bash
      run: node scripts/fetch-plugins.mjs

    - name: Check the helper plays Dexed
      shell: bash
      run: |
        if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a node scripts/check-plugin-host.mjs; else node scripts/check-plugin-host.mjs; fi

    - name: Check native live audio (virtual interface)
      shell: bash
      run: |
        if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a node scripts/check-live-audio.mjs; else node scripts/check-live-audio.mjs; fi
